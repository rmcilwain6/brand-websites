name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evrydayarchive
      ADMIN_API_BASE_URL: https://api.evrydayarchive.local

    steps:
      - name: 1) Checkout repository
        uses: actions/checkout@v4

      - name: 2) Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 3) Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 4) Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 5) Generate Prisma client
        run: pnpm --filter @repo/db generate

      - name: 6) Build workspace
        run: pnpm build

      - name: 7) Run TypeScript check
        run: pnpm typecheck

      - name: 8) Run lint check
        run: pnpm lint

      - name: 9) Run format check
        run: pnpm format:check

      - name: 10) Run tests
        run: pnpm test
