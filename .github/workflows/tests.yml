name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  env:
    DATABASE_URL: postgresql://user:pass@localhost:5000/db?schema=public

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evrydayarchive
      NEXT_PUBLIC_API_BASE_URL: https://api.evrydayarchive.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug build env
        run: |
          node -e "console.log('HAS_DATABASE_URL', !!process.env.DATABASE_URL)"
          node -e "console.log('HAS_NEXT_PUBLIC_API_BASE_URL', !!process.env.NEXT_PUBLIC_API_BASE_URL)"

      - name: Generate Prisma client
        run: pnpm --filter @repo/db generate

      - name: Run typecheck
        run: pnpm typecheck

      - name: Log database DATABASE_URL
        run: node -e "console.log('HAS_DATABASE_URL', Boolean(process.env.DATABASE_URL))"

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm test
