name: Pull Request Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate build and static checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evrydayarchive
      ADMIN_API_BASE_URL: https://api.evrydayarchive.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db generate

      - name: Build workspace
        run: pnpm build

      - name: Run TypeScript check
        run: pnpm typecheck

      - name: Run lint check
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    needs: validate
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evrydayarchive
      ADMIN_API_BASE_URL: https://api.evrydayarchive.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db generate

      - name: Run tests
        run: pnpm test
